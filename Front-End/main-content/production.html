<!-- =========================
     PRODUCTION MODULE
========================= -->

<!-- Tabs -->
<div class="tab-nav">
    <a href="#" class="tab-link active"
        onclick="switchTab(event,'jobOrderSection')">
        Job Orders & Tracking
    </a>

    <a href="#" class="tab-link"
        onclick="switchTab(event,'schedulingSection')">
        Scheduling Engine
    </a>

    <a href="#" class="tab-link"
        onclick="switchTab(event,'savedRecordSection')">
        Saved Records & Comments
    </a>
</div>

<!-- =====================================================
     JOB ORDER TAB
===================================================== -->

<div id="jobOrderSection" class="tab-content active-content">

    <!-- Toolbar -->
    <div class="toolbar">

        <button class="btn btn-primary">
            <i class='bx bx-plus'></i>
            Create Job Order
        </button>

        <button class="btn btn-secondary">
            <i class='bx bx-printer'></i>
            Print Production Sheet
        </button>

        <button class="btn btn-secondary">
            Forward Status
        </button>

        <button class="btn btn-text">
            <i class='bx bx-save'></i>
            Save
        </button>

    </div>

    <!-- ======================
         JOB ORDER DETAILS
    ======================= -->

    <div class="form-section">

        <h3 class="section-title">
            Job Order Details
        </h3>

        <div class="form-row">

            <div class="form-group">
                <label>Job Order ID</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Project ID</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Client Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Order Date</label>
                <input type="date" class="form-control">
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Target Date Delivery</label>
                <input type="date" class="form-control">
            </div>

            <div class="form-group">
                <label>Bleeding</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Eyelet</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Tiling</label>
                <input type="text" class="form-control">
            </div>

        </div>

        <div class="form-row full">

            <div class="form-group">

                <label>
                    Special Instructions / Project Description
                </label>

                <textarea class="form-control"></textarea>

            </div>

        </div>

    </div>

    <br>

    <!-- ======================
         PRODUCTION SHEET
    ======================= -->

    <div class="form-section">

        <h3 class="section-title">
            Production Sheet & Tracking
        </h3>

        <div class="form-row">

            <div class="form-group">
                <label>JO Item ID</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" class="form-control">
            </div>

            <div class="form-group">
                <label>Size (W × L)</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Machine Assigned</label>
                <input type="text" class="form-control">
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Artist Initial</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Production Initial</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Ink Prediction (L)</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Status</label>

                <select class="form-control">
                    <option>Pending</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                    <option>Delivered</option>
                </select>

            </div>

        </div>

    </div>

</div>

<!-- =====================================================
     SCHEDULING ENGINE
===================================================== -->

<div id="schedulingSection" class="tab-content">
<!-- Top Action Toolbar -->
    <div class="toolbar">
        <button class="btn btn-primary">+ Schedule Task</button>
        <button class="btn btn-secondary">Optimize Timeline</button>
        <button class="btn btn-secondary">Resolve Conflicts</button>
    </div>

    <!-- Main Scheduling Card -->
    <div class="form-section">
        <div class="section-title">Installation & Print Scheduling</div>

        <!-- Row 1 -->
        <div class="form-row">
            <div class="form-group">
                <label>Schedule ID</label>
                <input type="text" class="form-control">
            </div>
            <div class="form-group">
                <label>Job Order ID</label>
                <input type="text" class="form-control">
            </div>
            <div class="form-group">
                <label>Scheduled Date</label>
                <div class="input-icon-wrap">
                    <input type="text" class="form-control" placeholder="dd/mm/yyyy">
                    <span class="icon">📅</span>
                </div>
            </div>
            <div class="form-group">
                <label>Time Slot</label>
                <input type="text" class="form-control">
            </div>
        </div>

        <!-- Row 2 -->
        <div class="form-row">
            <div class="form-group">
                <label>Assigned Machine</label>
                <input type="text" class="form-control">
            </div>
            <div class="form-group">
                <label>Team Installer</label>
                <input type="text" class="form-control">
            </div>
            <div class="form-group">
                <label>Client Location</label>
                <input type="text" class="form-control">
            </div>
            <div class="form-group">
                <label>Status</label>
                <input type="text" class="form-control">
            </div>
        </div>

        <!-- Row 3: Conflict Check Alerts -->
        <div class="form-group alert-group">
            <label>⚠️ Conflict Check Alerts (Duplicate Booking Prevention)</label>
            <textarea id="ai_error_alerts" class="form-control"></textarea>
        </div>
    </div>

</div>

<!-- =====================================================
     SAVED RECORDS
===================================================== -->

<div id="savedRecordSection" class="tab-content">

    <div class="form-section">

        <h3 class="section-title">
            Saved Records & Comments
        </h3>

        <p>
            Saved production records will appear here.
        </p>

    </div>

</div>
